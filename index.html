*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
html.lg body{zoom:1.12}
body{color:var(--tx);font-family:var(--font);font-weight:var(--fw-r);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;
 background:radial-gradient(700px 440px at 92% -8%,var(--g1) 0,transparent 62%),radial-gradient(620px 440px at -5% 108%,var(--g2) 0,transparent 62%),var(--bg);background-attachment:fixed;transition:background-color .3s,color .3s}
button{font:inherit;font-family:var(--font);cursor:pointer;color:inherit}
.top{position:sticky;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px)}
.tin{max-width:600px;margin:0 auto}

.dnav{display:flex;align-items:center;gap:8px;margin-top:10px}

.ib:active{background:var(--hair2)}

.tdy{font-size:12.5px;font-weight:var(--fw-b);padding:0 14px;width:auto;border-radius:22px}
main{max-width:600px;margin:0 auto;padding:4px 16px calc(var(--nav) + env(safe-area-inset-bottom,0px) + 28px);touch-action:pan-y}

 background:linear-gradient(to top,color-mix(in srgb,var(--ac) 65%,transparent) 0 1.5px,transparent 1.5px)}
.stabs::-webkit-scrollbar{display:none}
.st{position:relative;flex:none;display:flex;align-items:center;gap:7px;padding:8px 15px;border:1px solid var(--hair2);border-bottom:0;border-radius:15px 15px 0 0;
 background:var(--row);color:var(--mu);font-size:13.5px;font-weight:var(--fw-m);white-space:nowrap;transition:background .2s,color .2s,padding .2s}
.st::after{content:'';position:absolute;left:0;right:0;bottom:0;height:1.5px;background:color-mix(in srgb,var(--ac) 65%,transparent)}

.st i.full{background:var(--c)}
.st.on{color:var(--tx);padding:11px 17px 10px;z-index:1;font-weight:var(--fw-b);
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 24%,var(--surf)),color-mix(in srgb,var(--c) 9%,var(--surf)));
 border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:inset 0 2.5px 0 0 var(--c),0 -6px 18px -10px color-mix(in srgb,var(--c) calc(var(--glow)*100%),transparent)}
.st.on::after{display:none}
.view.sec .card:first-child,.view.sec>.banner+.card{margin-top:16px}
.view.sec{animation:vin .2s ease-out}
.view{animation:vin .24s ease-out}@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.sL{animation:sL .24s ease-out}@keyframes sL{from{opacity:.2;transform:translateX(28px)}}
.sR{animation:sR .24s ease-out}@keyframes sR{from{opacity:.2;transform:translateX(-28px)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--nav-bg);backdrop-filter:blur(18px);border-top:1px solid var(--hair);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabsin{max-width:600px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--mu);font-size:11.5px;font-weight:var(--fw-m);background:none;border:0}

.card{--c:var(--c0);background:var(--surf);border:1px solid var(--hair);border-radius:26px;padding:18px 16px;margin:14px 0;box-shadow:var(--shadow),inset 0 1px 0 var(--hair)}
.hero{display:flex;align-items:center;gap:20px}
.big{font-family:var(--font-h);font-weight:var(--wn);font-size:calc(32px*var(--hs));line-height:1.05;letter-spacing:-.01em}
.tag{font:var(--fw-b) 12.5px var(--font);color:var(--c);letter-spacing:.02em}
.hint{color:var(--mu);font-size:13px;line-height:1.45}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:0 2px}
.nm{font-family:var(--font-h);font-weight:var(--wh);font-size:calc(19px*var(--hs));line-height:1.2;margin-top:1px}
.ch .p{color:var(--c);font-family:var(--font-h);font-weight:var(--wn);font-size:calc(20px*var(--hs))}
.chev{color:var(--mu);font-size:18px;transition:transform .2s;transform:rotate(-90deg);width:22px;text-align:center}.chev.open{transform:none}
.bar{height:6px;background:var(--track);border-radius:6px;overflow:hidden;margin:12px 2px 8px}

.row{display:flex;align-items:center;gap:13px;min-height:60px;padding:9px 4px 9px 14px;margin:7px 0;border-radius:20px;background:var(--row);border:1px solid var(--hair);position:relative;overflow:hidden;cursor:pointer;user-select:none;transition:transform .12s,background .2s;width:100%;color:var(--tx);text-align:left}
.row:active{transform:scale(.985)}
.row.d{background:color-mix(in srgb,var(--c) 9%,var(--row))}
.ck{width:28px;height:28px;border-radius:50%;border:2.2px solid color-mix(in srgb,var(--c) 85%,transparent);flex:none;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.row.d .ck{background:var(--c);border-color:var(--c);box-shadow:0 0 calc(12px*var(--glow)) -2px var(--c)}
.row.d .ck::after{content:'';width:6px;height:11px;border:solid var(--on);border-width:0 2.6px 2.6px 0;border-radius:1px;transform:translateY(-1px) rotate(45deg)}
.row.pop .ck{animation:pop .36s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{40%{transform:scale(1.28)}}
.row.d .lb{color:color-mix(in srgb,var(--tx) 62%,transparent)}
.lbw{flex:1;min-width:0}
.lb{font-size:15.5px;font-weight:var(--fw-m);line-height:1.3}
.meta{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.mini{display:flex;gap:3.5px}
.mini i{width:6px;height:6px;border-radius:50%;background:var(--track);display:block}
.mini i.on{background:var(--c)}

.mo{width:44px;height:44px;border-radius:50%;color:var(--mu);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;background:none;border:0}
.f{position:absolute;left:0;bottom:0;height:3px;border-radius:0 3px 3px 0;background:var(--c)}
.add{justify-content:center;border-style:dashed;border-color:var(--hair2);background:none;color:var(--mu);min-height:48px;font-weight:var(--fw-m)}
.addg{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;margin:14px 0;border:1.5px dashed var(--hair2);border-radius:26px;color:var(--mu);background:none;font-weight:var(--fw-m)}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair2);background:var(--ctrl);color:var(--tx);font-size:21px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.sb:active{background:color-mix(in srgb,var(--c) 30%,transparent)}
.sn{min-width:20px;text-align:center;color:var(--c);font-weight:var(--fw-x)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:18px;padding:8px 0 7px;text-align:center;background:var(--row);border:1px solid var(--hair);color:var(--tx);font-weight:var(--fw-b)}
.wd.sel{border-color:var(--cx);background:color-mix(in srgb,var(--cx) 14%,var(--row))}
.wd:disabled{opacity:.35}
.wd small{display:block;font-size:11px;font-weight:var(--fw-m);color:var(--mu)}
.wd svg{width:30px;height:30px;display:block;margin:4px auto 0}
.mc{padding:14px 2px;border-bottom:1px solid var(--hair)}.mc:last-of-type{border-bottom:0}
.mh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.mh b{font-weight:var(--fw-b);font-size:16px}.mh span{color:var(--mu);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{height:48px;border-radius:16px;border:1px solid var(--hair2);background:var(--ctrl);color:var(--mu);font-size:17px;font-weight:var(--fw-b);transition:background .15s,transform .15s}
.scale button.on{background:var(--c);color:var(--on);border-color:var(--c);transform:scale(1.04);box-shadow:0 0 calc(14px*var(--glow)) -3px var(--c)}
.numin{display:flex;align-items:center;gap:8px}
.numin input{flex:1;text-align:center;font-size:18px;font-weight:var(--fw-b)}
input[type=number],input[type=text],textarea,select{background:var(--input);color:var(--tx);border:1px solid var(--hair2);border-radius:14px;padding:11px 13px;font:inherit;font-family:var(--font);font-size:16px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--c,var(--c0)) 60%,transparent);outline-offset:1px}
select{width:auto}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.seg{display:flex;background:var(--row);border-radius:16px;padding:4px;border:1px solid var(--hair);gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--mu);padding:9px 6px;border-radius:12px;font-size:13px;font-weight:var(--fw-b);white-space:nowrap}
.seg button.on{background:var(--surf);color:var(--tx);box-shadow:0 2px 8px -4px #0006}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--hair2);background:none;color:var(--mu);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:var(--fw-m)}
.chips button.on{border-color:var(--c4);color:var(--tx);background:color-mix(in srgb,var(--c4) 16%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--row);border:1px solid var(--hair);border-radius:20px;padding:13px 11px}
.tile b{display:block;font-family:var(--font-h);font-weight:var(--wn);font-size:calc(26px*var(--hs));line-height:1}
.tile span{display:block;font-size:11.5px;color:var(--mu);margin-top:7px;line-height:1.3}
.chart{position:relative;padding-top:42px;margin:4px 0 2px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--mu);font-family:var(--font)}
.chart .gl{stroke:var(--hair2)}
.tip{position:absolute;top:0;transform:translateX(-50%);pointer-events:none;background:var(--tipbg);color:#f3eff7;border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums;line-height:1.35}
.heatw{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.heat{display:flex;gap:3px}

.hc.sel{border-color:var(--tx)}
.pr{display:grid;grid-template-columns:1fr 50px 76px;gap:8px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer}
.pr.h{cursor:default;font-size:11.5px;font-weight:var(--fw-b);color:var(--mu);padding-top:2px}
.pr .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:var(--fw-b)}
.pr .mu{color:var(--mu);font-weight:var(--fw-m)}
.rb{height:5px;background:var(--track);border-radius:5px;margin-top:7px;overflow:hidden}.rb i{display:block;height:100%;border-radius:5px}
.cmp{padding:11px 2px;border-bottom:1px solid var(--hair)}
.cmp .t1{display:flex;gap:8px;font-size:14px;font-weight:var(--fw-m)}.cmp .t1 span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:var(--fw-m)}

.dv::before{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--mu);opacity:.6}
.dv i{position:absolute;top:0;bottom:0;border-radius:4px}
.empty{text-align:center;padding:28px 12px;color:var(--mu)}
.set{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 14px;margin:7px 0;border-radius:18px;background:var(--row);border:1px solid var(--hair);color:var(--tx);text-align:left;font-weight:var(--fw-m)}
.set span{flex:1}.set em{font-style:normal;color:var(--mu);font-weight:var(--fw-m)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 4px}
.th{border-radius:20px;padding:12px;border:2px solid transparent;text-align:left;background:var(--tbg);color:var(--ttx);position:relative}
.th.on{border-color:var(--cx)}
.th b{display:block;font-size:15px;margin-bottom:2px}.th small{display:block;font-size:11.5px;opacity:.7;margin-bottom:8px}
.th .sws{display:flex;gap:4px}.th .sws i{width:16px;height:16px;border-radius:50%}
#bd{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:8}
#bd.on{opacity:1;pointer-events:auto}
#sh{--c:var(--c0);position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:90vh;overflow:auto;background:var(--sheet);border-top:1px solid var(--hair2);border-radius:30px 30px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:600px;margin:0 auto;box-shadow:0 -20px 50px -20px #0008}
#sh.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--hair2);margin:0 auto 14px}

 else if(kind==='contour'){const blob=(cx,cy,R0,k,ph,col,op)=>{let o='';for(let L=1;L<=k;L++){const R=R0*L/k;let d='';for(let t=0;t<=72;t++){const a=t/72*Math.PI*2,r=R*(1+.11*Math.sin(3*a+ph+L*.35)+.06*Math.sin(5*a-ph*1.7+L*.2)+.03*Math.sin(9*a+L));d+=(t?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)*.8).toFixed(1)}o+=`<path d="${d}Z" fill="none" style="stroke:${col}" stroke-width="${mini?.6:.9}" opacity="${op}"/>`}return o};

/* ---------- logic ---------- */
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const short=s=>pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const allG=()=>[...S.lanes,...S.phases,...S.stages];
const grp=id=>allG().find(g=>g.id===id);
const sn=g=>String(g.name||'').replace(/^Stage\s*0\.0\s*[–-]\s*/i,'')||g.name;
const kindOf=g=>S.stages.includes(g)?'stages':S.phases.includes(g)?'phases':'lanes';
const phasesOf=st=>S.phases.filter(p=>p.stage===st.id);
const subsOf=ph=>S.lanes.filter(l=>l.phase===ph.id);
function stageOf(g){const k=kindOf(g);if(k==='stages')return g;if(k==='phases')return grp(g.stage)||S.stages[0];const ph=grp(g.phase);return ph?stageOf(ph):S.stages[0]}
const parentPh=g=>kindOf(g)==='lanes'?grp(g.phase):null;
const sibs=g=>{const k=kindOf(g);return k==='stages'?S.stages:k==='phases'?S.phases.filter(p=>p.stage===g.stage):S.lanes.filter(l=>l.phase===g.phase)};
// Full label, e.g. "Stage 0.0 · Phase 0 · iii)"; rel() drops the stage.
function crumb(g){const k=kindOf(g),st=stageOf(g);if(k==='stages')return g.name;if(k==='phases')return `${st.name} · ${sn(g)}`;const ph=parentPh(g);return `${st.name} · ${ph?sn(ph):''} · ${g.name}`}
function rel(g){const k=kindOf(g);if(k==='stages')return g.name;if(k==='phases')return sn(g);const ph=parentPh(g);return `${ph?sn(ph)+' · ':''}${g.name}`}
const levelName={stages:'Stage',phases:'Phase',lanes:'Sub-phase'};
function findItem(id){for(const g of allG()){const it=g.items.find(i=>i.id===id);if(it)return [g,it]}return null}
const itemOf=(gid,iid)=>grp(gid).items.find(i=>i.id===iid);
const kidsOf=it=>((S.rollup||{})[it.id]||[]).map(findItem).filter(Boolean);
const isRolled=it=>it.type!=='money'&&((S.rollup||{})[it.id]||[]).length>0;
const parentsOf=id=>Object.keys(S.rollup||{}).filter(p=>S.rollup[p].includes(id)).map(findItem).filter(Boolean);
function prog(i){if(i.type==='money')return S.reached&&S.reached[i.id]?1:Math.min((+i.cur||0)/(+i.target||1),1);
 if(isRolled(i)){const k=kidsOf(i);return k.length&&k.every(x=>prog(x[1])>=1)?1:0}
 return i.done?1:0}
function latch(){let ch=false;allG().forEach(g=>g.items.forEach(i=>{if(i.type==='money'&&i.cur>=i.target&&!S.reached[i.id]){S.reached[i.id]=today();ch=true}}));return ch}
const sec=a=>a.length?a.reduce((s,i)=>s+prog(i),0)/a.length:0;
const peers=it=>allG().flatMap(g=>g.items.filter(i=>i.type==='money'&&key(i.label)===key(it.label)).map(i=>[g,i]));
// A stage's exit criteria: items flagged inside its phases and sub-phases, plus the stage's own criteria.
function stageExit(st){const linked=S.exit.map(findItem).filter(x=>x&&x[0]!==st&&kindOf(x[0])!=='stages'&&stageOf(x[0])===st);return [...linked,...st.items.map(i=>[st,i])]}
const exitPct=st=>sec(stageExit(st).map(x=>x[1]));
const stageItems=st=>[...phasesOf(st).flatMap(p=>[...subsOf(p),p]),st].flatMap(g=>g.items);
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function completedGroups(){return new Set(allG().filter(g=>g.items.length&&sec(g.items)>=1).map(g=>g.id))}
function celebrate(before){const after=completedGroups();for(const id of after)if(!before.has(id)){const g=grp(id);toast(`${crumb(g)} complete`);buzz();setTimeout(buzz,160);return}}
function setBal(label,v){v=Math.max(0,Math.round((+v||0)*100)/100);const before=completedGroups();
 allG().forEach(g=>g.items.forEach(i=>{if(i.type==='money'&&key(i.label)===key(label))i.cur=v}));
 latch();
 const h=S.hist[key(label)]=S.hist[key(label)]||[];const t=today();if(h.length&&h[h.length-1].d===t)h[h.length-1].v=v;else h.push({d:t,v});if(h.length>400)h.splice(0,h.length-400);
 save();celebrate(before)}
function toggleDone(it){const before=completedGroups();it.done=!it.done;
 (S.links||[]).forEach(([a,b])=>{if(it.id===a||it.id===b){[a,b].forEach(x=>{const f=findItem(x);if(f)f[1].done=it.done})}});
 save();if(it.done){buzz();popId=it.id}celebrate(before)}

function ctx(){let st=grp(ui.st);if(!st||kindOf(st)!=='stages')st=S.stages[0];
 const phs=phasesOf(st);let ph=grp(ui.ph);if(!ph||kindOf(ph)!=='phases'||ph.stage!==st.id)ph=phs[0]||null;
 const sbs=ph?subsOf(ph):[];let sb=grp(ui.sb);if(!sb||kindOf(sb)!=='lanes'||!ph||sb.phase!==ph.id)sb=sbs[0]||null;
 ui.st=st.id;ui.ph=ph?ph.id:null;ui.sb=sb?sb.id:null;return {st,ph,sb,phs,sbs}}

 if(k==='stages'){ui.st=g.id}else if(k==='phases'){ui.st=g.stage;ui.ph=g.id}else{const ph=parentPh(g);ui.ph=ph&&ph.id;ui.st=ph&&ph.stage;ui.sb=g.id}

/* ---------- render pieces ---------- */
function ring(p,size,gid){const o=263.9*(1-p);return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="flex:none;filter:drop-shadow(0 0 calc(14px*var(--glow)) color-mix(in srgb,var(--cx) 30%,transparent))"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ring1)"/><stop offset="1" style="stop-color:var(--ring2)"/></linearGradient></defs><circle cx="50" cy="50" r="42" fill="none" style="stroke:var(--track)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="url(#${gid})" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="${o}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .6s"/><text x="50" y="58.5" text-anchor="middle" style="fill:var(--tx);font-family:var(--font-h);font-weight:var(--wn);font-size:calc(23px*var(--hs))">${pc(p)}</text></svg>`}
function mRing(p){const o=75.4*(1-p);return `<svg class="mr" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="none" style="stroke:var(--track)" stroke-width="3.2"/><circle cx="14" cy="14" r="12" fill="none" style="stroke:var(--c)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="${o}" transform="rotate(-90 14 14)" opacity="${p?1:0}"/></svg>`}
let popId=null;
function row(g,it,showGroup){const p=prog(it),money=it.type==='money',ex=S.exit.includes(it.id),rd=S.reached[it.id];
 const meta=[];if(showGroup&&kindOf(g)!=='stages')meta.push(`<span class="gtag" style="--c:var(${g.color})">${esc(rel(g))}</span>`);
 if(money)meta.push(rd?`<span>Reached ${short(rd)}${it.cur<it.target?` · now ${fm(it.cur)}`:''}</span>`:`<span>${fm(it.cur)} of ${fm(it.target)}</span>`,rd?'':`<span>${pc(p)}</span>`);
 if(isRolled(it)){const k=kidsOf(it);meta.push(`<span>${k.filter(x=>prog(x[1])>=1).length}/${k.length} from sub-phases</span>`)}
 if(!showGroup&&kindOf(g)==='lanes'){const pa=parentsOf(it.id);if(pa.length)meta.push(`<span class="gtag" style="--c:var(${pa[0][0].color})">→ ${esc(pa.map(x=>x[1].label).join(', '))}</span>`)}
 if(ex&&!showGroup)meta.push(`<span class="badge">${esc(stageOf(g).name)} exit</span>`);
 const lead=money&&p<1?mRing(p):'<span class="ck"></span>';
 return `<div class="row ${p>=1?'d':''}${popId===it.id?' pop':''}" style="--c:var(${g.color})" onclick="tapI('${g.id}','${it.id}')">${lead}<div class="lbw"><div class="lb">${esc(it.label)}</div>${meta.length?`<div class="meta">${meta.join('')}</div>`:''}</div><button class="mo" aria-label="Edit" onclick="event.stopPropagation();editI('${g.id}','${it.id}')">⋯</button>${money&&p<1&&p>0?`<span class="f" style="width:${p*100}%"></span>`:''}</div>`}
function gCard(g){const p=sec(g.items);
 return `<section class="card" style="--c:var(${g.color})"><div class="ch" style="cursor:default"><div style="flex:1;min-width:0"><div class="tag">${esc(crumb(g))}</div><div class="nm">${esc(g.sub||levelName[kindOf(g)])}</div></div><span class="p">${pc(p)}</span></div><div class="bar"><i style="width:${p*100}%"></i></div>${g.items.map(i=>row(g,i)).join('')||'<div class="empty" style="padding:14px">No items yet.</div>'}<button class="row add" onclick="openGroup('${g.id}')">＋ Add / edit</button></section>`}
function ovRows(list){return list.map(g=>{const p=sec(g.items);return `<div class="ov" style="--c:var(${g.color})" onclick="goTo('${g.id}')"><div class="ow"><div class="ot">${esc(kindOf(g)==='lanes'?g.name:sn(g))} <span class="os">· ${esc(g.sub||'')}</span></div><div class="rb"><i style="width:${p*100}%;background:var(${g.color})"></i></div></div><b>${pc(p)}</b></div>`}).join('')}

function subsCard(ph){const sbs=subsOf(ph);
 return `<section class="card" style="--c:var(${ph.color})"><div class="tag">${esc(crumb(ph))}</div><div class="nm" style="margin-bottom:4px">Sub-phases</div>${sbs.length?ovRows(sbs):`<p class="hint">Not broken down yet. Sub-phases i), ii)… are smaller steps that build up to ${esc(sn(ph))}'s items.</p>`}<button class="row add" onclick="addGroup('lanes','${ph.id}')">＋ ${sbs.length?'Add sub-phase '+(ROMAN[sbs.length]||''):'Break into sub-phases'}</button></section>`}
function exitCard(st){const ex=stageExit(st),ep=exitPct(st);
 return `<section class="card" style="--c:var(${st.color})"><div class="ch" style="cursor:default"><div style="flex:1"><div class="tag">${esc(st.name)}</div><div class="nm">Exit criteria</div></div><span class="p">${pc(ep)}</span></div><div class="bar"><i style="width:${ep*100}%"></i></div>${ex.map(([g,i])=>row(g,i,true)).join('')||'<div class="empty" style="padding:14px">No exit criteria yet.</div>'}
 <button class="row add" onclick="openGroup('${st.id}')">＋ Add exit criterion</button><p class="hint" style="margin-top:8px">Criteria can be added here directly, or flagged from any phase or sub-phase item via ⋯ → "${esc(st.name)} exit criterion".</p></section>`}

  tail:`<button class="addg" onclick="addGroup('stages')">＋ New stage</button>`}}
function vHome(){const c=ctx(),st=c.st;
 const ex=stageExit(st),dn=ex.filter(x=>prog(x[1])>=1).length,ep=exitPct(st);
 const hero=`<section class="card hero" style="--c:var(--c0)">${seedOfLife()}${ring(ep,108,'gr')}<div><div class="tag">${esc(st.name)}</div><div class="big">${dn} of ${ex.length}</div><div class="hint">exit criteria met</div><div class="hint" style="margin-top:6px">${c.phs.length} phase${c.phs.length===1?'':'s'} · ${pc(sec(stageItems(st)))} of all items</div></div></section>`;
 const sum=hero+(c.phs.length?`<section class="card" style="--c:var(--c1)"><div class="tag">${esc(st.name)}</div><div class="nm" style="margin-bottom:4px">Phases</div>${ovRows(c.phs)}</section>`:'')+(c.ph&&c.sbs.length?`<section class="card" style="--c:var(--c0)"><div class="tag">${esc(crumb(c.ph))}</div><div class="nm" style="margin-bottom:4px">Sub-phases</div>${ovRows(c.sbs)}</section>`:'');
 const nexts=[];c.phs.forEach(p=>{[...subsOf(p),p].forEach(g=>{const i=g.items.find(x=>prog(x)<1);if(i)nexts.push([g,i])})});if(!c.phs.length)st.items.filter(i=>prog(i)<1).slice(0,6).forEach(i=>nexts.push([st,i]));

 return {sel:SEC.home||'sum',secs:[{id:'sum',label:'Summary',c:'--c0',html:()=>sum},{id:'next',label:'Up next',c:'--c2',html:()=>next},{id:'bal',label:'Balances',c:'--cx',html:()=>bal},{id:'chk',label:w?`Checks · ${w}`:'Checks',c:w?'--c2':'--c5',full:!w,html:chkCard}]}}
function checks(){const out=[];
 S.phases.forEach(ph=>{const sbs=subsOf(ph);if(!sbs.length)return;const li=sbs.flatMap(g=>g.items.map(i=>[g,i]));
  ph.items.forEach(i=>{if(i.type==='money'){const ms=li.filter(([g,x])=>x.type==='money'&&key(x.label)===key(i.label));
    if(!ms.length)out.push(['warn',`${crumb(ph)} "${i.label}" (${fm(i.target)}) has no sub-phase milestone`,ph.id,i.id]);
    else{const mx=Math.max(...ms.map(m=>m[1].target));if(mx<i.target)out.push(['warn',`Sub-phases only reach ${fm(mx)} for "${i.label}", but ${crumb(ph)} needs ${fm(i.target)}`,ph.id,i.id])}}

 return out}

 ${c.map(([lv,t,gid,iid])=>`<div class="ov" style="--c:var(${lv==='warn'?'--c2':'--c4'})" onclick="${iid?`editI('${gid}','${iid}')`:`goTo('${gid}')`}"><span style="font-size:18px;color:var(--c);width:22px;text-align:center">${lv==='warn'?'⚠':'ℹ'}</span><div class="ow"><div class="os" style="color:var(--tx);font-size:14px">${esc(t)}</div></div></div>`).join('')}</section>`}

 const ba=backupAge();

 const parts=[['stages',c.st.name]];

 return parts.map(([lv,l],ix)=>`${ix?'<span class="csep">›</span>':''}<button class="cr${lv===v?' on':''}" onclick="pick('${lv}')">${esc(l)} ▾</button>`).join('')}
function render(anim){

 const V=VIEWS[ui.view]();const lvl=['stages','phases','lanes'].includes(ui.view);

 else{st.style.display='none';st.innerHTML=''}

 $('main').innerHTML=`<div class="view ${anim||''}">${body}</div>`;
 const on=st.querySelector('.st.on');if(on&&st.style.display!=='none'){const tgt=on.offsetLeft-st.clientWidth/2+on.clientWidth/2;st.scrollTo({left:Math.max(0,tgt),behavior:anim==='sec'?'smooth':'auto'})}

/* ---------- actions ---------- */
function setSec(id){const v=ui.view;
 if(['stages','phases','lanes'].includes(v)){if(id==='all'){if(ALL[v]){scrollTo({top:0,behavior:'smooth'});return}ALL[v]=true}
  else{const was=!ALL[v]&&(v==='stages'?ui.st:v==='phases'?ui.ph:ui.sb)===id;ALL[v]=false;if(was){scrollTo({top:0,behavior:'smooth'});return}
   if(v==='stages')ui.st=id;else if(v==='phases')ui.ph=id;else ui.sb=id}}
 else{if(SEC[v]===id){scrollTo({top:0,behavior:'smooth'});return}SEC[v]=id}
 render('sec');scrollTo(0,0)}
function setView(v){if(v===ui.view){scrollTo({top:0,behavior:'smooth'});return}ui.view=v;saveUI();render();scrollTo(0,0)}
function pick(level){const c=ctx(),list=level==='stages'?S.stages:level==='phases'?c.phs:c.sbs,curId=level==='stages'?c.st.id:level==='phases'?c.ph&&c.ph.id:c.sb&&c.sb.id;
 const head=level==='stages'?'Stages':level==='phases'?`${c.st.name} · Phases`:`${c.ph?crumb(c.ph):''} · Sub-phases`;
 show(`<div class="tag">Go to</div><h3>${esc(head)}</h3>${list.map(g=>{const p=sec(level==='stages'?stageExit(g).map(x=>x[1]):g.items);return `<div class="ov" style="--c:var(${g.color})" onclick="choose('${level}','${g.id}')"><div class="ow"><div class="ot">${esc(level==='lanes'?g.name:sn(g))}${g.id===curId?' <span class="badge">viewing</span>':''} <span class="os">· ${esc(g.sub||'')}</span></div><div class="rb"><i style="width:${p*100}%;background:var(${g.color})"></i></div></div><b>${pc(p)}</b></div>`}).join('')||'<p class="hint">None yet.</p>'}
 <div class="btns" style="margin-top:14px">${level!=='stages'||true?`<button class="bb g" style="flex:1" onclick="addGroup('${level}','${level==='stages'?'':level==='phases'?c.st.id:c.ph?c.ph.id:''}')">＋ New ${levelName[level].toLowerCase()}</button>`:''}<button class="bb" style="flex:1" onclick="closeM()">Done</button></div>`,'--cx')}
// Choosing from a breadcrumb changes the context and keeps you on the current screen where that makes sense.
function choose(level,gid){const g=grp(gid);ALL[level]=false;
 if(level==='stages'){ui.st=gid;ui.ph=null;ui.sb=null}else if(level==='phases'){ui.ph=gid;ui.sb=null}else ui.sb=gid;
 const order=['stages','phases','lanes'];if(!['stages','phases','lanes'].includes(ui.view)||order.indexOf(ui.view)<order.indexOf(level))ui.view=level;
 closeM()}
function tapI(gid,iid){const it=itemOf(gid,iid);if(it.type==='money')return moneyI(gid,iid);if(isRolled(it))return partsI(gid,iid);toggleDone(it);render()}
function partsI(gid,iid){const g=grp(gid),it=itemOf(gid,iid),k=kidsOf(it);
 show(`<div class="tag">${esc(crumb(g))}</div><h3>${esc(it.label)}</h3><p class="hint">Ticks itself when all of these sub-phase items are done. Tap one to tick it here.</p>${k.map(([kg,ki])=>{const d=prog(ki)>=1;return `<div class="row ${d?'d':''}" style="--c:var(${kg.color})" onclick="${ki.type==='money'?`moneyI('${kg.id}','${ki.id}')`:`toggleDone(itemOf('${kg.id}','${ki.id}'));partsI('${gid}','${iid}');render()`}"><span class="ck"></span><div class="lbw"><div class="lb">${esc(ki.label)}</div><div class="meta"><span class="gtag" style="--c:var(${kg.color})">Sub-phase ${esc(kg.name)}</span></div></div></div>`}).join('')}
 <div class="btns" style="margin-top:16px"><button class="bb g" onclick="editI('${gid}','${iid}')">Change links</button><button class="bb" style="flex:1" onclick="closeM()">Done</button></div>`,g.color)}
let sx0=null;
$('main').addEventListener('touchstart',e=>{const t=e.target;if(t.closest('input,textarea,.seg,.stabs,.pats,.themes')){sx0=null;return}sx0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
$('main').addEventListener('touchend',e=>{if(!sx0)return;const t=e.changedTouches[0],dx=t.clientX-sx0[0],dy=t.clientY-sx0[1];sx0=null;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy))swipeSec(dx<0?1:-1)},{passive:true});
function swipeSec(d){const V=VIEWS[ui.view]();if(V.secs.length<2)return;const ids=[...V.secs.map(x=>x.id),'all'];const lvl=['stages','phases','lanes'].includes(ui.view);
 let cur=lvl&&ALL[ui.view]?'all':(V.sel||ids[0]);let i=ids.indexOf(cur)+d;if(i<0||i>=ids.length)return;
 const id=ids[i];if(lvl){if(id==='all')ALL[ui.view]=true;else{ALL[ui.view]=false;if(ui.view==='stages')ui.st=id;else if(ui.view==='phases')ui.ph=id;else ui.sb=id}}else SEC[ui.view]=id;
 render(d>0?'sL':'sR');scrollTo(0,0)}

/* ---------- sheets ---------- */
function show(h,c){if(!$('sh').classList.contains('on')){try{history.pushState({sheet:1},'')}catch(e){}}const s=$('sh');s.style.setProperty('--c',`var(${c||'--c0'})`);s.innerHTML='<div class="grab"></div>'+h;s.scrollTop=0;s.classList.add('on');$('bd').classList.add('on')}
function closeM(fromPop){const was=$('sh').classList.contains('on');if(was&&!fromPop&&history.state&&history.state.sheet){history.back();return}$('sh').classList.remove('on');$('bd').classList.remove('on');render()}
addEventListener('popstate',()=>{if($('sh').classList.contains('on'))closeM(true)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sh').classList.contains('on'))closeM()});
function arm(b,fn){if(b.dataset.armed){fn();return}b.dataset.armed=1;const t=b.textContent;b.textContent='Tap again to confirm';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t}},4000)}
const DONE='<div class="btns" style="margin-top:18px"><button class="bb g" style="flex:1" onclick="closeM()">Done</button></div>';

function histSVG(label){const h=(S.hist[key(label)]||[]).slice(-60);if(h.length<2)return '';
 const vs=h.map(x=>x.v),lo=0,hi=Math.max(...vs,1),W=320,H=70;const P=h.map((x,i)=>[(i/(h.length-1)*(W-8)+4).toFixed(1),(H-6-(x.v-lo)/(hi-lo)*(H-14)).toFixed(1)]);
 return `<h4>Balance over time</h4><svg class="hist" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" style="stroke:var(--c)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${P.map(p=>p.join(',')).join(' ')}"/></svg><div class="hint" style="display:flex;justify-content:space-between"><span>${short(h[0].d)}</span><span>${short(h[h.length-1].d)}</span></div>`}
function moneyI(gid,iid){const g=grp(gid),it=itemOf(gid,iid),ps=peers(it).sort((a,b)=>a[1].target-b[1].target);
 show(`<div class="tag">${esc(g.name)}</div><h3>${esc(it.label)}</h3>
 <div class="hint" style="text-align:center">Current balance</div>
 <div class="bignum"><button class="sb" onclick="stepBal('${gid}','${iid}',-50)">−</button><input type="number" inputmode="decimal" id="bv" min="0" step="any" value="${+it.cur||''}" placeholder="0" onchange="setBal(itemOf('${gid}','${iid}').label,+this.value);refreshMoney('${gid}','${iid}')"><button class="sb" onclick="stepBal('${gid}','${iid}',50)">+</button></div>
 <div class="qa">${[100,250,500,1000].map(a=>`<button onclick="stepBal('${gid}','${iid}',${a})">+${fm(a)}</button>`).join('')}</div>
 <h4>Milestones${ps.length>1?' · balance shared across these':''}</h4><div id="msl">${msList(ps)}</div>${histSVG(it.label)}
 ${it.note?`<p class="hint">${esc(it.note)}</p>`:''}
 <div class="btns" style="margin-top:16px"><button class="bb g" onclick="editI('${gid}','${iid}')">Edit item</button><button class="bb" style="flex:1" onclick="closeM()">Done</button></div>`,g.color)}
function msList(ps){return ps.map(([g,i])=>{const rd=S.reached[i.id],ok=!!rd||i.cur>=i.target;return `<div class="ms" style="--c:var(${g.color})"><span class="ok${ok?' y':''}">${ok?'✓':''}</span><span>${esc(crumb(g))} <span class="hint">· ${esc(g.sub||'')}</span></span><em>${fm(i.target)}${rd?` · reached ${short(rd)}`:ok?'':` · ${fm(i.target-i.cur)} to go`}</em></div>`}).join('')}
function refreshMoney(gid,iid){const it=itemOf(gid,iid);$('bv').value=+it.cur||'';$('msl').innerHTML=msList(peers(it).sort((a,b)=>a[1].target-b[1].target))}
function stepBal(gid,iid,d){const it=itemOf(gid,iid);setBal(it.label,(+it.cur||0)+d);if(d>0)buzz();refreshMoney(gid,iid)}

function editI(gid,iid){const g=grp(gid),it=itemOf(gid,iid),ex=S.exit.includes(iid),k=kindOf(g),st=stageOf(g);
 const others=allG().filter(x=>x.id!==gid);
 const subItems=k==='phases'?subsOf(g).flatMap(lg=>lg.items.filter(x=>x.type!=='money').map(x=>[lg,x])):[];
 show(`<div class="tag">${esc(crumb(g))}</div><h3>Edit item</h3><input type="text" value="${esc(it.label)}" onchange="setIt('${gid}','${iid}','label',this.value)">
 <div class="fr"><label>Type</label><select onchange="chType('${gid}','${iid}',this.value)"><option value="check"${it.type==='check'?' selected':''}>Tick when done</option><option value="money"${it.type==='money'?' selected':''}>Money target</option></select></div>
 ${it.type==='money'?`<div class="fr"><label>Target (£)</label><input type="number" min="1" value="${it.target}" onchange="setIt('${gid}','${iid}','target',+this.value||1)"></div><p class="hint">Money items with the same name share one balance, so updating "${esc(it.label)}" anywhere updates every milestone for it.</p>`:''}
 ${it.type==='money'&&S.reached[iid]?`<div class="fr"><label>Milestone reached ${short(S.reached[iid])}</label><button class="bb g" onclick="delete S.reached['${iid}'];latch();save();editI('${gid}','${iid}')">Reset</button></div>`:''}
 ${k==='stages'?`<p class="hint">This is one of ${esc(st.name)}'s own exit criteria.</p>`:`<label class="tgl"><span>${esc(st.name)} exit criterion</span><input type="checkbox" ${ex?'checked':''} onchange="setExit('${iid}',this.checked)"></label>`}
 ${it.type!=='money'&&k==='phases'?(subItems.length?`<h4>Delivered by sub-phase items</h4><p class="hint" style="margin-top:0">Ticked items here make "${esc(it.label)}" tick itself once they're all done.</p>${subItems.map(([lg,x])=>`<label class="tgl" style="--c:var(${lg.color})"><span><span class="gtag">${esc(lg.name)}</span> ${esc(x.label)}</span><input type="checkbox" ${((S.rollup||{})[iid]||[]).includes(x.id)?'checked':''} onchange="setRoll('${iid}','${x.id}',this.checked)"></label>`).join('')}`:`<p class="hint">Once ${esc(sn(g))} has sub-phases, you can link this item to the sub-phase items that deliver it.</p>`):''}
 ${k==='lanes'&&parentsOf(iid).length?`<p class="hint">Feeds into ${esc(sn(parentPh(g)||g))}: ${esc(parentsOf(iid).map(x=>x[1].label).join(', '))}</p>`:''}
 <h4>Context & notes</h4><textarea placeholder="Detail, blockers, Plane board link…" onchange="setIt('${gid}','${iid}','note',this.value)">${esc(it.note||'')}</textarea>
 <h4>Arrange</h4><div class="btns"><button class="bb g" onclick="mvI('${gid}','${iid}',-1)">Move up</button><button class="bb g" onclick="mvI('${gid}','${iid}',1)">Move down</button><select onchange="if(this.value)moveTo('${gid}','${iid}',this.value)"><option value="">Move to…</option>${others.map(o=>`<option value="${o.id}">${esc(crumb(o))}${o.sub?' · '+esc(o.sub):''}</option>`).join('')}</select></div>
 <div class="btns"><button class="bb dg" onclick="arm(this,()=>delI('${gid}','${iid}'))">Delete item</button></div>${DONE}`,g.color)}
function setIt(gid,iid,f,v){itemOf(gid,iid)[f]=v;if(f==='target'){delete S.reached[iid];latch()}save()}
function setRoll(p,c,on){S.rollup=S.rollup||{};const a=(S.rollup[p]||[]).filter(x=>x!==c);if(on)a.push(c);if(a.length)S.rollup[p]=a;else delete S.rollup[p];save()}
function chType(gid,iid,t){const it=itemOf(gid,iid);it.type=t;if(t==='money'){it.target=it.target||1000;it.cur=+it.cur||0}save();editI(gid,iid)}
function setExit(iid,on){S.exit=S.exit.filter(x=>x!==iid);if(on)S.exit.push(iid);save();toast(on?'Added to exit criteria':'Removed from exit criteria')}
function mvI(gid,iid,d){const g=grp(gid),i=g.items.findIndex(x=>x.id===iid),j=i+d;if(j<0||j>=g.items.length)return;[g.items[i],g.items[j]]=[g.items[j],g.items[i]];save();toast(d<0?'Moved up':'Moved down')}
function moveTo(gid,iid,to){const g=grp(gid),it=itemOf(gid,iid);g.items=g.items.filter(x=>x.id!==iid);grp(to).items.push(it);save();closeM()}
function dropIds(ids){S.exit=S.exit.filter(x=>!ids.includes(x));ids.forEach(id=>{delete S.rollup[id];delete S.reached[id]});for(const p in S.rollup){S.rollup[p]=S.rollup[p].filter(x=>!ids.includes(x));if(!S.rollup[p].length)delete S.rollup[p]}}
function delI(gid,iid){const g=grp(gid);g.items=g.items.filter(x=>x.id!==iid);dropIds([iid]);save();closeM()}

function openGroup(gid){const g=grp(gid),kind=kindOf(g),L=levelName[kind].toLowerCase();
 const kids=kind==='stages'?phasesOf(g):kind==='phases'?subsOf(g):[];
 show(`<div class="tag">${esc(crumb(g))}</div><h3>${esc(g.sub||levelName[kind])}</h3>
 <h4>${kind==='stages'?'Add exit criterion':'Add item'}</h4><input type="text" id="nl" placeholder="${kind==='stages'?'e.g. >£10k net in the past month':'e.g. Dental check-up booked'}" onkeydown="if(event.key==='Enter')addI('${gid}')"><div class="btns"><input type="number" id="nt" placeholder="£ target (optional)" style="flex:1"><button class="bb" onclick="addI('${gid}')">Add</button></div>
 <h4>Name & description</h4><input type="text" value="${esc(g.name)}" onchange="grp('${gid}').name=this.value;save()"><div style="height:8px"></div><input type="text" placeholder="Short description" value="${esc(g.sub||'')}" onchange="grp('${gid}').sub=this.value;save()">
 <h4>Colour</h4><div class="sw">${COLORS.map(c=>`<button class="${g.color===c?'on':''}" style="background:var(${c})" aria-label="Colour" onclick="grp('${gid}').color='${c}';save();openGroup('${gid}')"></button>`).join('')}</div>
 <h4>Arrange</h4><div class="btns"><button class="bb g" onclick="mvG('${gid}',-1)">Move earlier</button><button class="bb g" onclick="mvG('${gid}',1)">Move later</button><button class="bb dg" onclick="arm(this,()=>delG('${gid}'))">Delete ${L}${kids.length?` and its ${kind==='stages'?'phases':'sub-phases'}`:''}</button></div>${DONE}`,g.color);
 setTimeout(()=>{const e=$('nl');e&&e.focus()},60)}
function addI(gid){const g=grp(gid),l=$('nl').value.trim();if(!l)return;const t=+$('nt').value;const it=t>0?M(nid(),l,t):G(nid(),l);g.items.push(it);
 if(t>0){const p=peers(it).find(x=>x[1]!==it);if(p)it.cur=p[1].cur;latch()}
 save();toast('Added: '+l);$('nl').value='';$('nt').value='';$('nl').focus()}
function mvG(gid,d){const g=grp(gid),k=kindOf(g),arr=S[k],sb=sibs(g),i=sb.indexOf(g),o=sb[i+d];if(!o)return;const ia=arr.indexOf(g),ib=arr.indexOf(o);[arr[ia],arr[ib]]=[arr[ib],arr[ia]];save();toast(d<0?'Moved earlier':'Moved later')}
function delG(gid){const g=grp(gid),k=kindOf(g);let gone=[g];
 if(k==='stages'){const phs=phasesOf(g);gone=gone.concat(phs,phs.flatMap(subsOf))}else if(k==='phases')gone=gone.concat(subsOf(g));
 dropIds(gone.flatMap(x=>x.items.map(i=>i.id)));
 S.stages=S.stages.filter(x=>!gone.includes(x));S.phases=S.phases.filter(x=>!gone.includes(x));S.lanes=S.lanes.filter(x=>!gone.includes(x));
 if(!S.stages.length)S.stages.push({id:'s'+nid(),name:'Stage 0.0',sub:'',color:'--cx',items:[]});
 save();closeM()}
function addGroup(kind,parent){const c=ctx();let g;
 if(kind==='stages'){const n=S.stages.length;g={id:'s'+nid(),name:`Stage 0.${n}`,sub:'',color:['--cx','--c4','--c1','--c6','--c5'][n%5],items:[]};S.stages.push(g)}
 else if(kind==='phases'){const st=grp(parent)||c.st,n=phasesOf(st).length;g={id:'p'+nid(),stage:st.id,name:`Phase ${n}`,sub:'',color:COLORS[n%7],items:[]};S.phases.push(g)}
 else{const ph=grp(parent)||c.ph;if(!ph)return;const n=subsOf(ph).length;g={id:'l'+nid(),phase:ph.id,name:ROMAN[n]||`${n+1})`,sub:'',color:COLORS[n%7],items:[]};S.lanes.push(g)}
 save();toast(`Added ${crumb(g)}`);goTo(g.id);openGroup(g.id)}
function openTitle(){show(`<h3>App title</h3><input type="text" id="t1" value="${esc(S.title||'')}"><div class="btns" style="margin-top:14px"><button class="bb" style="flex:1" onclick="S.title=$('t1').value.trim()||'Minimum Viable Foundations';save();closeM()">Save</button></div>`,'--c1')}



/* ---------- backup ---------- */
function lastBackup(){try{return localStorage.getItem('stage0-lastbackup')}catch(e){return null}}
function backupAge(){const l=lastBackup();if(!l)return null;return Math.floor((pd(today())-pd(l))/864e5)}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function downloadBackup(){dl('stage0-backup-'+today()+'.json',JSON.stringify({app:'stage0',v:1,exported:new Date().toISOString(),data:S}),'application/json');try{localStorage.setItem('stage0-lastbackup',today())}catch(e){}toast('Backup saved to Downloads');render()}
function parseBackup(t){const n=JSON.parse(t);return norm(n&&n.data?n.data:n)}
function readBackup(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let n;try{n=parseBackup(r.result)}catch(e){toast('That file is not a Stage 0 backup');return}
 const cnt=[...n.lanes,...n.phases].reduce((a,g)=>a+g.items.length,0);
 show(`<h3>Restore backup</h3><p class="hint">${esc(f.name)} · ${n.lanes.length} sub-phases, ${n.phases.length} phases, ${cnt} items. This replaces everything on this phone.</p><div class="btns" style="flex-direction:column"><button class="bb" onclick="doRestore()">Restore</button><button class="bb g" onclick="closeM()">Cancel</button></div>`,'--cx');window._pending=n};r.readAsText(f)}
function doRestore(){if(window._pending){S=window._pending;window._pending=null;save();toast('Restored');closeM()}}
function openData(){show(`<h3>Backup text</h3><div class="hint">Copy this text to keep it. To restore, paste a saved copy here (including text from the old Stage 0.0 console's Export / import) and tap Restore. Restore replaces everything on this phone.</div><textarea id="dt" style="min-height:200px;margin:10px 0;font-size:12px">${esc(JSON.stringify(S))}</textarea>
 <div class="btns"><button class="bb" onclick="copyD(this)">Copy</button><button class="bb g" onclick="importD()">Restore</button><button class="bb dg" onclick="arm(this,resetAll)">Reset to defaults</button></div>${DONE}`,'--cx')}
async function copyD(b){const t=$('dt');try{await navigator.clipboard.writeText(t.value);b.textContent='Copied'}catch(e){t.select();try{document.execCommand('copy');b.textContent='Copied'}catch(_){b.textContent='Select & copy manually'}}}
function importD(){try{S=parseBackup($('dt').value);save();toast('Restored');closeM()}catch(e){$('dt').style.borderColor='var(--c3)';toast('That text is not valid Stage 0 data')}}
function resetAll(){S=clone(DEF);save();toast('Reset to defaults');closeM()}

{const v=new URLSearchParams(location.search).get('view');if(v&&VIEWS[v]){ui.view=v;history.replaceState(null,'',location.pathname)}}
render();
(async()=>{try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))await navigator.storage.persist()}catch(e){}})();
let newSW=null;
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
 const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){newSW=w;$('upd').classList.add('on')}})};
 if(reg.waiting&&navigator.serviceWorker.controller){newSW=reg.waiting;$('upd').classList.add('on')}
 reg.addEventListener('updatefound',()=>watch(reg.installing));
 setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
}).catch(()=>{})});
 let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}})}
function applyUpdate(){if(newSW)newSW.postMessage('skipWaiting');else location.reload()}
